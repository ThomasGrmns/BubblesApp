<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bubbles Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Belleza&family=Public+Sans:wght@400;500;600;700&family=Source+Sans+3:wght@400;700&display=swap">
<meta name="theme-color" content="#072843">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bubbles Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: one phone-width column (max 560px). Sticky top bar, scrolling content, fixed bottom action bar in the editor. */
:root {
  --bg: #f2f5f4;
  --surface: #ffffff;
  --surface-2: #e8edeb;
  --ink: #0d2234;
  --muted: #586776;
  --line: #d6dee2;
  --accent: var(--brand-light, #072843);
  --on-accent: var(--brand-light-ink, #ffffff);
  --accent-2: var(--brand-2, #ce8458);
  --danger: #a8231b;
  --scrim: rgba(7, 20, 32, .55);
  --font-ui: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: var(--brand-h1, "Belleza"), Georgia, "Times New Roman", serif;
  --r: 14px;
  --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1520; --surface: #12202d; --surface-2: #1a2b3a; --ink: #e7eef3; --muted: #9fb1c0; --line: #24384a;
    --accent: var(--brand-dark, #8caecc); --on-accent: var(--brand-dark-ink, #0a1520); --danger: #f1a9a3; --scrim: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1520; --surface: #12202d; --surface-2: #1a2b3a; --ink: #e7eef3; --muted: #9fb1c0; --line: #24384a;
  --accent: var(--brand-dark, #8caecc); --on-accent: var(--brand-dark-ink, #0a1520); --danger: #f1a9a3; --scrim: rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font: 16px/1.45 var(--font-ui); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 10px; min-height: 58px; padding-block: 8px; }
.bar h1 { font: 400 1.5rem/1.1 var(--font-display); margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }
.name-input { flex: 1; min-width: 0; border: 1px solid transparent; background: transparent; border-radius: var(--r-sm); padding: 8px 10px; font: 400 1.3rem/1.2 var(--font-display); }
.name-input:focus { border-color: var(--line); background: var(--surface); outline: none; }
.saved { font-size: .78rem; color: var(--muted); white-space: nowrap; }

/* home */
.home-head { padding-block: 34px 22px; display: grid; gap: 6px; }
.home-head .mark { width: 54px; height: 54px; color: var(--accent-2); }
.home-head h1 { font: 400 2.6rem/1 var(--font-display); margin: 6px 0 0; letter-spacing: .01em; }
.home-head p { margin: 0; color: var(--muted); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 18px 16px; display: grid; gap: 4px; align-content: start; min-height: 128px; }
.tile svg { width: 26px; height: 26px; color: var(--accent-2); margin-bottom: 8px; }
.tile .t { font-weight: 600; font-size: 1.05rem; }
.tile .s { color: var(--muted); font-size: .88rem; }
.tile.new { grid-column: 1 / -1; background: var(--accent); color: var(--on-accent); border-color: transparent; min-height: 0; grid-template-columns: auto 1fr; align-items: center; column-gap: 14px; padding: 20px 18px; }
.tile.new svg { color: var(--on-accent); margin: 0; width: 30px; height: 30px; grid-row: span 2; }
.tile.new .s { color: inherit; opacity: .8; }
.section-title { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 28px 0 10px; }

/* lists */
.list { display: grid; gap: 10px; padding-block: 16px 40px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.proj { display: grid; grid-template-columns: 64px 1fr; gap: 14px; padding: 12px; align-items: center; }
.proj .thumb { width: 64px; aspect-ratio: 9 / 16; border-radius: 8px; background: var(--surface-2) center / cover no-repeat; border: 1px solid var(--line); }
.proj .info { min-width: 0; display: grid; gap: 2px; }
.proj .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj .meta { color: var(--muted); font-size: .85rem; }
.proj .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.proj video { grid-column: 1 / -1; width: 100%; max-height: 70vh; border-radius: 10px; background: #000; }
.pill { display: inline-block; font-size: .72rem; font-weight: 600; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.empty { text-align: center; padding: 48px 16px; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty svg { width: 44px; height: 44px; color: var(--accent-2); }
.empty strong { color: var(--ink); font-size: 1.05rem; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 16px; font-weight: 600; font-size: .92rem; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 7px 12px; font-size: .84rem; }
.btn.block { width: 100%; padding: 14px 18px; font-size: 1rem; }
.btn:disabled { opacity: .45; cursor: default; }

/* editor */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface-2); border-radius: 999px; padding: 4px; margin-block: 12px; }
.steps button { border: 0; background: transparent; border-radius: 999px; padding: 9px 4px; font-weight: 600; font-size: .9rem; color: var(--muted); }
.steps button[aria-current="step"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.steps b { font-weight: 700; color: var(--accent-2); margin-right: 4px; }
.page { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.actionbar .wrap { display: flex; gap: 10px; padding-block: 12px; }
.actionbar .btn { flex: 1; padding: 13px 14px; }

.music { padding: 14px; display: grid; gap: 10px; margin-bottom: 14px; }
.music .head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.music .head .t { flex: 1 1 150px; }
.music { min-width: 0; }
.music .head svg { width: 22px; height: 22px; color: var(--accent-2); flex: none; }
.music .head .t { flex: 1; min-width: 0; }
.music .head .t div:first-child { font-weight: 600; }
.music .head .t div:last-child { color: var(--muted); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.scenes { display: grid; gap: 14px; }
.scene { padding: 12px; display: grid; gap: 12px; }
.scene-head { display: flex; align-items: center; gap: 6px; }
.scene-head .num { font: 400 1.2rem/1 var(--font-display); flex: 1; }
.scene-head .icon-btn { width: 36px; height: 36px; }
.scene-head .icon-btn svg { width: 17px; height: 17px; }
.scene-body { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: start; }
.slot { width: 96px; aspect-ratio: 9 / 16; border-radius: 10px; border: 1.5px dashed var(--line); background: var(--surface-2) center / cover no-repeat; display: grid; place-items: center; text-align: center; font-size: .78rem; color: var(--muted); padding: 6px; position: relative; overflow: hidden; }
.slot.has { border-style: solid; }
.slot svg { width: 24px; height: 24px; color: var(--accent-2); }
.slot .kind { position: absolute; left: 6px; bottom: 6px; background: rgba(0,0,0,.6); color: #fff; font-size: .68rem; padding: 2px 6px; border-radius: 6px; }
.fields { display: grid; gap: 8px; min-width: 0; }
.field { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: var(--r-sm); padding: 9px 11px; font-size: 16px; }
.field:focus { outline: none; border-color: var(--accent-2); background: var(--surface); }
.field.t1 { font-family: var(--font-display); font-size: 18px; }
textarea.field { resize: vertical; min-height: 64px; }
.dur { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.dur label { font-size: .85rem; color: var(--muted); }
.dur output { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 4.2ch; text-align: right; }
input[type="range"] { width: 100%; accent-color: var(--accent-2); }
.add-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.vo { display: grid; gap: 8px; padding: 10px; border-radius: var(--r-sm); background: var(--bg); border: 1px solid var(--line); }
.vo-head { display: flex; align-items: center; gap: 8px; font-size: .8rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.vo-head svg { width: 18px; height: 18px; color: var(--accent-2); }
.vo .field { background: var(--surface); }
.vo-row { display: flex; flex-wrap: wrap; gap: 6px; }
.lib { display: grid; gap: 8px; max-height: 52vh; overflow-y: auto; }
.lib-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 12px; }
.lib-row .t { display: grid; min-width: 0; text-align: left; }
.lib-row .t span { font-size: .84rem; color: var(--muted); }
.lib-row[aria-current="true"] { border-color: var(--accent-2); box-shadow: 0 0 0 1px var(--accent-2) inset; }
.vo-head .pill { margin-left: auto; text-transform: none; letter-spacing: 0; }
#modal .box.rec { gap: 16px; }
.prompter { max-height: 42vh; overflow-y: auto; display: grid; gap: 10px; padding: 14px; border-radius: 12px; background: var(--bg); }
.prompter p { margin: 0; color: var(--ink); font: 400 1.45rem/1.35 var(--font-display); }
.prompter p.muted { color: var(--muted); font: 1rem/1.4 var(--font-ui); }
.rec-time { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.6rem; font-variant-numeric: tabular-nums; font-weight: 600; }
.rec-time .dot { width: 14px; height: 14px; border-radius: 50%; background: #d23b30; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .rec-time .dot { animation: none; } }

/* design */
.strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: thin; }
.chip { flex: none; width: 44px; aspect-ratio: 9 / 16; border-radius: 7px; border: 2px solid transparent; background: var(--surface-2) center / cover no-repeat; display: grid; place-items: end center; font-size: .72rem; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.8); padding-bottom: 2px; }
.chip[aria-current="true"] { border-color: var(--accent-2); }
.preview-wrap { display: grid; justify-items: center; gap: 8px; }
.preview { height: min(56vh, 520px); max-width: 100%; aspect-ratio: 9 / 16; border-radius: 12px; background: #000; touch-action: none; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.hint { font-size: .82rem; color: var(--muted); text-align: center; }
.panel { display: grid; gap: 16px; padding: 16px 14px; margin-top: 14px; }
.ctl { display: grid; gap: 8px; }
.ctl > span { font-size: .8rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 12px; font-size: .88rem; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.layouts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.layouts button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 6px 8px; display: grid; gap: 6px; justify-items: center; font-size: .8rem; font-weight: 600; }
.layouts button[aria-pressed="true"] { border-color: var(--accent-2); box-shadow: 0 0 0 2px var(--accent-2) inset; }
.layouts svg { width: 34px; height: 54px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent-2); }
.grid9 { display: grid; grid-template-columns: repeat(3, 38px); gap: 6px; }
.grid9 button { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.grid9 button i { width: 10px; height: 10px; border-radius: 3px; background: var(--muted); }
.grid9 button[aria-pressed="true"] { background: var(--accent); }
.grid9 button[aria-pressed="true"] i { background: var(--on-accent); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.check { display: flex; align-items: center; gap: 10px; font-size: .95rem; }
.check input { width: 20px; height: 20px; accent-color: var(--accent-2); }

/* export */
.player { display: grid; justify-items: center; gap: 10px; }
.controls { display: flex; align-items: center; gap: 12px; width: min(100%, 320px); }
.controls .time { font-variant-numeric: tabular-nums; font-size: .85rem; color: var(--muted); min-width: 8ch; text-align: right; }
.progress { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); position: relative; cursor: pointer; }
.progress i { position: absolute; inset: 0 auto 0 0; background: var(--accent-2); border-radius: 3px; }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; padding: 12px 6px; margin-top: 14px; }
.summary div { display: grid; }
.summary b { font: 400 1.5rem/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.summary span { font-size: .78rem; color: var(--muted); }
.result { padding: 14px; display: grid; gap: 12px; margin-top: 14px; }
.result video { width: 100%; max-height: 60vh; border-radius: 10px; background: #000; }
.note { font-size: .85rem; color: var(--muted); }
.warn { font-size: .88rem; padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); }
.warn.install { display: grid; gap: 4px; padding: 14px; }

/* settings */
.set { padding: 16px 14px; display: grid; gap: 14px; margin-top: 14px; }
.set h2 { font: 400 1.35rem/1.2 var(--font-display); margin: 0; }
.set p.sub { margin: -8px 0 0; color: var(--muted); font-size: .88rem; }
.palette { display: flex; flex-wrap: wrap; gap: 14px; }
.pc { display: grid; justify-items: center; gap: 4px; position: relative; }
.pc label { width: 58px; height: 58px; border-radius: 50%; box-shadow: 0 0 0 1px var(--line); border: 3px solid var(--surface); display: block; cursor: pointer; position: relative; overflow: hidden; }
.pc input[type="color"] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; padding: 0; }
.pc code { font-size: .74rem; color: var(--muted); }
.pc .x { position: absolute; top: -4px; right: -4px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.pc .x svg { width: 12px; height: 12px; }
.pc.add label { display: grid; place-items: center; border: 1.5px dashed var(--line); box-shadow: none; background: transparent; color: var(--muted); }
.pc.add svg { width: 22px; height: 22px; }
.fontrow { display: grid; gap: 8px; padding-block: 10px; border-top: 1px solid var(--line); }
.fontrow:first-of-type { border-top: 0; }
.fontrow .top { display: flex; gap: 8px; align-items: center; }
.fontrow .top span { font-size: .8rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); flex: 1; }
.fontrow select { border: 1px solid var(--line); background: var(--bg); border-radius: var(--r-sm); padding: 10px; width: 100%; font-size: 16px; }
.fontrow .sample { font-size: 1.5rem; line-height: 1.2; overflow-wrap: anywhere; }
.bold-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 800; }
.bold-btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.bold-btn:disabled { opacity: .35; }

/* modal, toast, overlay */
#modal { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: grid; place-items: end center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
#modal .box { background: var(--surface); border-radius: 18px; padding: 20px; width: min(100%, 440px); display: grid; gap: 14px; }
#modal h3 { margin: 0; font: 400 1.35rem/1.2 var(--font-display); }
#modal p { margin: 0; color: var(--muted); }
#modal .row { display: flex; gap: 10px; }
#modal .row .btn { flex: 1; }
#toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .9rem; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px); text-align: center; }
#toast.show { opacity: 1; }
.overlay { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: grid; place-items: center; padding: 24px; }
.overlay .box { background: var(--surface); border-radius: 18px; padding: 22px; width: min(100%, 380px); display: grid; gap: 14px; text-align: center; }
.overlay canvas { height: 46vh; max-width: 100%; aspect-ratio: 9 / 16; border-radius: 10px; margin: 0 auto; background: #000; }
.bigbar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bigbar i { display: block; height: 100%; width: 0; background: var(--accent-2); }
#stage { position: fixed; left: 0; top: 0; width: 2px; height: 2px; overflow: hidden; opacity: 0; pointer-events: none; }
#stage video { width: 2px; height: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app"></div>
<div id="stage" aria-hidden="true"></div>
<input type="file" id="file" hidden>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ---------- constants ---------- */
const FONTS = [
  ["Belleza", "Belleza", false], ["Source Sans 3", "Source+Sans+3:wght@400;700", true],
  ["Public Sans", "Public+Sans:wght@400;700", true], ["Playfair Display", "Playfair+Display:wght@400;700", true],
  ["Cormorant Garamond", "Cormorant+Garamond:wght@400;700", true], ["Cinzel", "Cinzel:wght@400;700", true],
  ["Lora", "Lora:wght@400;700", true], ["DM Serif Display", "DM+Serif+Display", false],
  ["Montserrat", "Montserrat:wght@400;700", true], ["Poppins", "Poppins:wght@400;700", true],
  ["Lato", "Lato:wght@400;700", true], ["Nunito", "Nunito:wght@400;700", true],
  ["Raleway", "Raleway:wght@400;700", true], ["Josefin Sans", "Josefin+Sans:wght@400;700", true],
  ["Quicksand", "Quicksand:wght@400;700", true], ["Dancing Script", "Dancing+Script:wght@400;700", true],
  ["Great Vibes", "Great+Vibes", false], ["Pacifico", "Pacifico", false], ["Sacramento", "Sacramento", false],
];
const SERIFS = new Set(["Belleza", "Playfair Display", "Cormorant Garamond", "Cinzel", "Lora", "DM Serif Display"]);
const SCRIPTS = new Set(["Dancing Script", "Great Vibes", "Pacifico", "Sacramento"]);
const ROLE_NAMES = { h1: "Título (H1)", h2: "Subtítulo (H2)", body: "Texto" };
const DEFAULT_SETTINGS = {
  primary: ["#072843", "#ce8458", "#f6f8f7"],
  secondary: ["#8caecc", "#d7bb89", "#000000"],
  fonts: { h1: { family: "Belleza", bold: false }, h2: { family: "Source Sans 3", bold: true }, body: { family: "Public Sans", bold: false } },

let pvBusy = false, pvAgain = false;
async function drawPreview() {
  if (pvBusy) { pvAgain = true; return; }
  pvBusy = true;
  try {
    const cv = $("#pv"); if (!cv) return; const sc = S.cur.scenes[S.sel];
    await ensureFonts();
    const m = await getMedia(sc.media);
    if (m?.kind === "video") await seekVideo(m.el, Math.min(sc.media.start + 0.4, Math.max(0, (m.dur || 1) - 0.1)));
    const ctx = cv.getContext("2d"); ctx.globalAlpha = 1;
    drawScene(ctx, cv.width, cv.height, sc, sc.duration * 0.5, { static: true });
  } finally { pvBusy = false; if (pvAgain) { pvAgain = false; requestAnimationFrame(drawPreview); } }
}
function bindPreviewDrag() {
  const cv = $("#pv"); let dragging = false;
  const apply = (e) => {
    const r = cv.getBoundingClientRect(); const nx = clamp((e.clientX - r.left) / r.width, 0, 1), ny = clamp((e.clientY - r.top) / r.height, 0, 1);
    const L = S.cur.scenes[S.sel].layout;
    if (L.type === "box") { L.x = nx; L.y = ny; }
    else if (L.type === "over") { L.y = ny; }
    else { L.ratio = clamp(L.side === "top" ? ny : L.side === "bottom" ? 1 - ny : L.side === "left" ? nx : 1 - nx, 0.25, 0.75); }
    drawPreview();
  };
  cv.addEventListener("pointerdown", (e) => { dragging = true; cv.setPointerCapture(e.pointerId); apply(e); });
  cv.addEventListener("pointermove", (e) => { if (dragging) apply(e); });
  const end = () => { if (!dragging) return; dragging = false; touch(); refreshControls(); };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
}
function refreshControls() { const c = $("#ctls"); if (c) c.innerHTML = designControls(); }

function renderExport() {
  const p = S.cur; const tl = timeline(p); const q = S.settings.quality;
  const W = q >= 1080 ? 1080 : 720, H = q >= 1080 ? 1920 : 1280;
  const missing = p.scenes.filter((s) => !s.media && !s.title && !s.subtitle && !s.body).length;

  $("#stepbody").innerHTML = `

      <div class="controls"><button class="icon-btn" id="pp" data-action="pp" aria-label="Reproducir">${ICON.play}</button><div class="progress" id="prog" role="slider" aria-label="Posición" aria-valuemin="0" aria-valuemax="${tl.total}"><i id="progi"></i></div><span class="time" id="ptime">0:00 / ${fmtSec(tl.total)}</span></div></div>
    <section class="card summary"><div><b>${p.scenes.length}</b><span>escenas</span></div><div><b>${fmtSec(tl.total)}</b><span>duración</span></div><div><b>${q}p</b><span>vertical 9:16</span></div></section>
    ${missing ? `<p class="warn" style="margin-top:14px">${missing === 1 ? "Una escena está vacía" : missing + " escenas están vacías"} (sin foto ni texto). Se verán como un fondo de color.</p>` : ""}

    <div id="resultbox">${S.lastResult && S.lastResult.pid === p.id ? resultHTML() : ""}</div>

async function doRecord() {
  const p = S.cur; if (!p.scenes.length) return;
  let ac = null; try { if (p.music || p.scenes.some((s) => s.voice?.blobId)) { ac = newAC(); ac?.resume?.(); } } catch {}
  S.player?.pause();
  const q = S.settings.quality; const W = q >= 1080 ? 1080 : 720, H = q >= 1080 ? 1920 : 1280;
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-labelledby="rt"><strong id="rt">Creando video…</strong><canvas width="${W}" height="${H}" id="rc"></canvas><div class="bigbar"><i id="rbar"></i></div><span class="note" id="rpct">0%</span><span class="note">Mantén esta pantalla abierta.</span></div>`;
  document.body.appendChild(ov);
  let lock = null; try { lock = await navigator.wakeLock?.request("screen"); } catch {}
  try {
    const blob = await recordVideo(p, $("#rc"), ac, (f) => { $("#rbar").style.width = (f * 100).toFixed(1) + "%"; $("#rpct").textContent = Math.round(f * 100) + "%"; });
    if (!blob.size) throw new Error("vacío");
    const id = uid(); await DB.put("blobs", blob, id);
    const old = p.video?.blobId;
    p.video = { blobId: id, type: blob.type, created: Date.now(), size: blob.size };
    p.status = "done"; p.thumb = await projectThumb(p); touch(); await flushSave(); upsertProject(p);
    if (old) await dropBlobIfUnused(old);
    const url = URL.createObjectURL(blob); urlCache.set(id, url);
    S.lastResult = { pid: p.id, url, blob, ext: blob.type.includes("mp4") ? "mp4" : "webm" };
    $("#resultbox").innerHTML = resultHTML(); $("#resultbox").scrollIntoView({ behavior: "smooth", block: "start" });
    toast("Video creado");
  } catch (e) { console.error(e); toast("No se pudo crear el video. Inténtalo de nuevo."); }
  finally { ov.remove(); try { lock?.release(); } catch {} try { ac?.close(); } catch {} }
}
async function projectThumb(p) {
  if (!p.scenes.length) return "";
  await ensureFonts(); await getMedia(p.scenes[0].media);
  const sc = p.scenes[0]; const m = sc.media && mediaCache.get(sc.media.blobId);
  if (m?.kind === "video") await seekVideo(m.el, Math.min(sc.media.start + 0.4, Math.max(0, (m.dur || 1) - 0.1)));
  const cv = document.createElement("canvas"); cv.width = 180; cv.height = 320;
  drawScene(cv.getContext("2d"), 180, 320, sc, sc.duration / 2, { static: true });
  try { return cv.toDataURL("image/jpeg", 0.75); } catch { return ""; }
}
function upsertProject(p) { const i = S.projects.findIndex((x) => x.id === p.id); if (i >= 0) S.projects[i] = p; else S.projects.push(p); }

/* ---------- voice + music actions ---------- */
let previewAudio = null;
function playPreview(url, loop = false) { stopPreview(); previewAudio = new Audio(url); previewAudio.loop = loop; previewAudio.play().catch(() => {}); return previewAudio; }
function stopPreview() { if (previewAudio) { previewAudio.pause(); previewAudio = null; } }
// recording sheet: shows the scene's text large (to read from) with a timer and a stop button
async function recordVoice(sc, i) {
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
  catch (e) {
    toast(e?.name === "NotAllowedError" ? "Permite el micrófono para grabar, o usa “Subir audio”." : "No se puede usar el micrófono aquí. Usa “Subir audio” con una nota de voz.");
    return;
  }
  stopPreview(); S.player?.pause();
  const lines = [sc.title, sc.subtitle, sc.body].map((x) => (x || "").trim()).filter(Boolean);
  const m = $("#modal");
  m.innerHTML = `<div class="box rec" role="dialog" aria-modal="true" aria-labelledby="rt"><h3 id="rt">Escena ${i + 1} · grabando</h3>
    <div class="prompter">${lines.length ? lines.map((l) => `<p>${esc(l)}</p>`).join("") : "<p class='muted'>Habla con calma, cerca del teléfono.</p>"}</div>
    <div class="rec-time"><i class="dot"></i><span id="rec-t">0:00</span></div>
    <div class="row"><button class="btn" id="rec-cancel">Cancelar</button><button class="btn primary" id="rec-stop">Listo</button></div></div>`;
  m.hidden = false;
  const chunks = []; let rec;
  try { rec = new MediaRecorder(stream); } catch { stream.getTracks().forEach((t) => t.stop()); m.hidden = true; toast("Este teléfono no puede grabar aquí. Usa “Subir audio”."); return; }
  rec.ondataavailable = (e) => { if (e.data?.size) chunks.push(e.data); };
  const done = new Promise((r) => (rec.onstop = r));
  let cancelled = false; const t0 = Date.now();
  const tick = setInterval(() => { const s = (Date.now() - t0) / 1000; const el = $("#rec-t"); if (el) el.textContent = fmtSec(s); if (s >= 90) finish(); }, 250);
  const finish = (cancel) => { cancelled = !!cancel; clearInterval(tick); if (rec.state !== "inactive") rec.stop(); };
  $("#rec-stop").onclick = () => finish(false); $("#rec-cancel").onclick = () => finish(true);
  rec.start(250);
  await done; stream.getTracks().forEach((t) => t.stop());
  m.hidden = true; m.innerHTML = "";
  if (cancelled) return;
  await storeVoice(sc, new Blob(chunks, { type: rec.mimeType || "audio/mp4" }), "mic");
}
async function storeVoice(sc, blob, source) {
  toast("Preparando la voz…");
  try {
    const r = await setSceneVoice(sc, await blob.arrayBuffer(), source); touch();
    if (S.view === "editor" && S.step === "scenes") renderScenes();
    toast(r === "extended" ? "Voz lista. Alargué la escena para que quepa." : "Voz lista");
  } catch (e) {
    console.error(e);
    toast(e?.message === "silencio" ? "No se escuchó nada. Revisa el micrófono e inténtalo otra vez." : "No se pudo leer ese audio. Prueba con otro archivo.");
  }
}
function openLibrary() {
  const p = S.cur; const m = $("#modal");
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">Música</h3><p>Piezas tranquilas que se repiten sin cortes, para videos de cualquier duración.</p>
    <div class="lib">${LIBRARY.map((t) => `<div class="lib-row" aria-current="${p.music?.lib === t.id}"><button class="icon-btn" data-lib-play="${t.id}" aria-label="Escuchar ${t.name}">${ICON.play}</button><div class="t"><b>${t.name}</b><span>${t.desc}</span></div><button class="btn sm primary" data-lib-use="${t.id}">Usar</button></div>`).join("")}</div>
    <div class="row"><button class="btn" id="lib-close">Cerrar</button><button class="btn" id="lib-upload">${ICON.music}Subir canción</button></div></div>`;
  m.hidden = false;
  let playing = null;
  const close = () => { stopPreview(); m.hidden = true; m.innerHTML = ""; m.onclick = null; };
  m.onclick = async (e) => {
    if (e.target === m) return close();
    const pl = e.target.closest("[data-lib-play]"), use = e.target.closest("[data-lib-use]");
    if (e.target.closest("#lib-close")) return close();
    if (pl) {
      const id = pl.dataset.libPlay; m.querySelectorAll("[data-lib-play]").forEach((b) => (b.innerHTML = ICON.play));
      if (playing === id) { stopPreview(); playing = null; return; }
      playPreview(LIBRARY.find((t) => t.id === id).file, true); playing = id; pl.innerHTML = ICON.pause; return;
    }
    if (use) {
      const t = LIBRARY.find((x) => x.id === use.dataset.libUse); const old = p.music?.blobId;
      p.music = { lib: t.id, name: t.name, volume: p.music?.volume ?? 0.7 }; touch(); close(); renderScenes();
      if (old) await dropBlobIfUnused(old); return;
    }
    if (e.target.closest("#lib-upload")) {
      close(); const files = await pickFiles("audio/*", false); if (!files[0]) return;
      const id = uid(); await DB.put("blobs", files[0], id); const old = p.music?.blobId;
      p.music = { blobId: id, name: files[0].name || "Canción", volume: p.music?.volume ?? 0.8 }; touch(); renderScenes();
      if (old) await dropBlobIfUnused(old);
    }
  };
}
/* ---------- events ---------- */
async function openProject(p) { S.cur = p; S.step = "scenes"; S.sel = 0; S.lastResult = null; S.view = "editor"; render(); }
async function closeEditor() {
  const p = S.cur; S.player?.destroy(); S.player = null;
  if (p) { p.thumb = await projectThumb(p); await flushSave(); upsertProject(p); }
  S.cur = null; S.view = "home"; render();
}
const sceneIndex = (el) => +el.closest("[data-i]")?.dataset.i;

document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-action]"); if (!b || b.disabled) return;
  const a = b.dataset.action; const p = S.cur;
  switch (a) {
    case "go": stopPreview(); if (S.view === "editor") { await closeEditor(); } S.view = b.dataset.view; render(); break;
    case "new": { const np = newProject(); S.projects.push(np); await DB.put("projects", np); openProject(np); break; }
    case "open": { const id = b.closest("[data-id]").dataset.id; const pr = S.projects.find((x) => x.id === id); if (pr) openProject(pr); break; }
    case "del-project": {
      const id = b.closest("[data-id]").dataset.id; const pr = S.projects.find((x) => x.id === id);
      if (!pr || !(await ask("¿Eliminar el proyecto?", `“${pr.name}” y su video se borrarán de este teléfono.`))) break;
      S.projects = S.projects.filter((x) => x.id !== id); await DB.del("projects", id);
      const ids = [...pr.scenes.flatMap((s) => [s.media?.blobId, s.voice?.blobId]), pr.music?.blobId, pr.video?.blobId].filter(Boolean);
      for (const bid of ids) await dropBlobIfUnused(bid);
      render(); toast("Proyecto eliminado"); break;
    }
    case "watch": {
      const card = b.closest("[data-id]"); const pr = S.projects.find((x) => x.id === card.dataset.id); if (!pr?.video) break;
      const u = await urlFor(pr.video.blobId); if (!u) { toast("No se encontró el video."); break; }
      if (!card.querySelector("video")) { const v = document.createElement("video"); v.src = u; v.controls = true; v.playsInline = true; card.appendChild(v); v.play().catch(() => {}); }
      break;
    }
    case "save-video": case "share-video": {
      const pr = S.projects.find((x) => x.id === b.closest("[data-id]").dataset.id); const bl = pr?.video && (await DB.get("blobs", pr.video.blobId));
      if (bl) saveVideoFile(bl, pr.name, a === "share-video" ? "share" : "save"); else toast("No se encontró el video."); break;
    }
    case "save-last": case "share-last": if (S.lastResult) saveVideoFile(S.lastResult.blob, p?.name, a === "share-last" ? "share" : "save"); break;
    case "install": if (installEvt) { const ev = installEvt; installEvt = null; ev.prompt(); try { await ev.userChoice; } catch {} render(); } break;
    case "close-editor": closeEditor(); break;
    case "step": stopPreview(); S.step = b.dataset.step; if (S.player) { S.player.destroy(); S.player = null; } renderEditor(); window.scrollTo(0, 0); break;
    case "add-scene": p.scenes.push(newScene(p.scenes[p.scenes.length - 1])); touch(); renderScenes(); setTimeout(() => document.querySelector(".scene:last-child")?.scrollIntoView({ behavior: "smooth", block: "center" }), 30); break;
    case "add-many": {
      const files = await pickFiles("image/*,video/*", true); if (!files.length) break;
      toast(`Añadiendo ${files.length}…`);
      let target = p.scenes.length === 1 && !p.scenes[0].media && !p.scenes[0].title && !p.scenes[0].subtitle && !p.scenes[0].body ? p.scenes.pop() : null;
      for (const f of files) { const sc = target || newScene(p.scenes[p.scenes.length - 1]); target = null; await setSceneMedia(sc, f); p.scenes.push(sc); }
      touch(); renderScenes(); toast("Listo"); break;
    }
    case "pick-media": {
      const i = sceneIndex(b); const files = await pickFiles("image/*,video/*", false); if (!files[0]) break;
      b.innerHTML = "<span>Cargando…</span>"; await setSceneMedia(p.scenes[i], files[0]); touch(); renderScenes(); break;
    }
    case "mv": { const i = sceneIndex(b), d = +b.dataset.d; const j = i + d; if (j < 0 || j >= p.scenes.length) break; [p.scenes[i], p.scenes[j]] = [p.scenes[j], p.scenes[i]]; touch(); renderScenes(); break; }
    case "dup": { const i = sceneIndex(b); const c = structuredClone(p.scenes[i]); c.id = uid(); p.scenes.splice(i + 1, 0, c); touch(); renderScenes(); break; }
    case "del-scene": {
      const i = sceneIndex(b); const sc = p.scenes[i];
      if ((sc.media || sc.title || sc.body) && !(await ask("¿Eliminar la escena?", `Escena ${i + 1} se quitará del proyecto.`))) break;
      p.scenes.splice(i, 1); if (!p.scenes.length) p.scenes.push(newScene()); touch(); renderScenes();
      if (sc.media) await dropBlobIfUnused(sc.media.blobId); if (sc.voice?.blobId) await dropBlobIfUnused(sc.voice.blobId); break;
    }
    case "pick-music": openLibrary(); break;
    case "vo-rec": { const i = sceneIndex(b); recordVoice(p.scenes[i], i); break; }
    case "vo-upload": {
      const sc = p.scenes[sceneIndex(b)]; const files = await pickFiles("audio/*", false); if (!files[0]) break;
      await storeVoice(sc, files[0], "file"); break;
    }
    case "vo-play": { const sc = p.scenes[sceneIndex(b)]; const u = sc.voice?.blobId && (await urlFor(sc.voice.blobId)); if (u) playPreview(u); break; }
    case "vo-rm": {
      const sc = p.scenes[sceneIndex(b)]; const old = sc.voice?.blobId;
      sc.voice = null; touch(); renderScenes(); if (old) await dropBlobIfUnused(old); break;
    }
    case "rm-music": { const old = p.music?.blobId; p.music = null; touch(); renderScenes(); if (old) await dropBlobIfUnused(old); break; }
    case "sel": S.sel = clamp(+b.dataset.i, 0, p.scenes.length - 1); renderDesign(); break;
    case "lay-type": {
      const L = p.scenes[S.sel].layout; const t = b.dataset.v; if (L.type === t) break;
      const darkText = ["title", "subtitle", "body"].every((k) => L[k] !== "w");
      if (t === "over" && darkText && p.scenes[S.sel].media) { L.title = "w"; L.subtitle = "w"; L.body = "w"; L.shade = true; }
      if (L.type === "over" && t !== "over" && L.title === "w") { L.title = "p0"; L.subtitle = "p1"; L.body = "p0"; }
      if (t === "over" && L.y > 0.9) L.y = 0.8;
      L.type = t; ensureReadable(p.scenes[S.sel]); touch(); refreshControls(); drawPreview(); break;
    }
    case "lay": { const L = p.scenes[S.sel].layout; const k = b.dataset.k; let v = b.dataset.v; if (k === "y") v = +v; L[k] = v; if (["bg", "box", "panel"].includes(k)) ensureReadable(p.scenes[S.sel]); touch(); refreshControls(); drawPreview(); break; }
    case "pos9": { const L = p.scenes[S.sel].layout; L.x = +b.dataset.x; L.y = +b.dataset.y; touch(); refreshControls(); drawPreview(); break; }
    case "apply-all": {
      const src = p.scenes[S.sel].layout;
      if (!(await ask("¿Usar este diseño en todas?", `El diseño de la escena ${S.sel + 1} se copiará a las ${p.scenes.length} escenas. El texto y las fotos no cambian.`, "Copiar diseño", false))) break;
      p.scenes.forEach((s) => { s.layout = structuredClone(src); }); touch(); toast("Diseño copiado a todas las escenas"); renderDesign(); break;
    }
    case "pp": {
      const pl = S.player; if (!pl) break;
      if (pl.playing) { pl.pause(); b.innerHTML = ICON.play; b.setAttribute("aria-label", "Reproducir"); }
      else { pl.play(); b.innerHTML = ICON.pause; b.setAttribute("aria-label", "Pausa"); }
      break;
    }
    case "record": doRecord(); break;
    case "rm-color": { const k = b.dataset.key; S.settings[k].splice(+b.dataset.i, 1); await saveSettings(); renderSettings(); break; }
    case "bold": { const r = b.dataset.role; S.settings.fonts[r].bold = !S.settings.fonts[r].bold; await saveSettings(); renderSettings(); break; }
    case "set": { const k = b.dataset.k; S.settings[k] = k === "quality" ? +b.dataset.v : b.dataset.v; await saveSettings(); renderSettings(); break; }
  }
});

document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "pname" && S.cur) { S.cur.name = t.value; touch(); return; }
  if (t.dataset.field && S.cur) {
    const i = sceneIndex(t); const sc = S.cur.scenes[i]; const f = t.dataset.field;
    if (f === "duration") { sc.duration = +t.value; t.nextElementSibling.textContent = fmtDur(sc.duration); const tt = $("#total"); if (tt) tt.textContent = fmtDur(timeline(S.cur).total); }
    else if (f === "start") { sc.media.start = +t.value; t.nextElementSibling.textContent = fmtDur(sc.media.start); clearTimeout(t._th); t._th = setTimeout(async () => { sc.thumb = await makeThumb(sc.media); const slot = t.closest(".scene").querySelector(".slot"); if (slot) slot.style.backgroundImage = `url('${sc.thumb}')`; touch(); }, 350); }
    else sc[f] = t.value;
    touch(); return;
  }
  if (t.dataset.actionInput === "music-vol" && S.cur?.music) { S.cur.music.volume = +t.value; t.nextElementSibling.textContent = Math.round(+t.value * 100) + "%"; touch(); return; }
  if (t.dataset.lay && S.cur) { const L = S.cur.scenes[S.sel].layout; L[t.dataset.lay] = +t.value; t.nextElementSibling.textContent = pct(+t.value); touch(); drawPreview(); return; }
  if (t.dataset.setting) { S.settings[t.dataset.setting] = +t.value; t.nextElementSibling.textContent = fmtDur(+t.value); clearTimeout(t._th); t._th = setTimeout(saveSettings, 300); return; }
  if (t.dataset.color) {
    const k = t.dataset.color; const lab = t.closest("label"); if (lab) lab.style.background = t.value;
    const code = t.closest(".pc")?.querySelector("code"); if (code && t.dataset.i !== "new") code.textContent = t.value.toUpperCase();
    if (t.dataset.i !== "new") { S.settings[k][+t.dataset.i] = t.value; clearTimeout(t._th); t._th = setTimeout(saveSettings, 250); }
  }
});
document.addEventListener("change", async (e) => {
  const t = e.target;
  if (t.dataset.layCheck && S.cur) { S.cur.scenes[S.sel].layout[t.dataset.layCheck] = t.checked; touch(); drawPreview(); return; }
  if (t.dataset.font) { const f = S.settings.fonts[t.dataset.font]; f.family = t.value; if (!fontInfo(f.family)[2]) f.bold = false; await saveSettings(); renderSettings(); return; }
  if (t.dataset.color) {
    const k = t.dataset.color;
    if (t.dataset.i === "new") { const max = k === "primary" ? 3 : 5; if (S.settings[k].length < max) S.settings[k].push(t.value); }
    else S.settings[k][+t.dataset.i] = t.value;
    await saveSettings(); renderSettings();
  }
});

/* ---------- boot ---------- */
(async function boot() {
  loadFontCSS();
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch {} // play sound even with the iPhone silent switch on
  app.innerHTML = `<main class="wrap"><header class="home-head"><div class="mark">${ICON.bubbles}</div><h1>Bubbles Studio</h1><p>Cargando…</p></header></main>`;
  await DB.open();
  const st = await DB.get("kv", "settings");
  if (st) S.settings = Object.assign(structuredClone(DEFAULT_SETTINGS), st, { fonts: Object.assign(structuredClone(DEFAULT_SETTINGS.fonts), st.fonts || {}) });
  S.projects = await DB.all("projects");
  const seeded = await DB.get("kv", "seeded");
  if (!seeded && !S.projects.length) { const ex = exampleProject(); S.projects.push(ex); await DB.put("projects", ex); await DB.put("kv", true, "seeded"); applyBrand(); ensureFonts().then(async () => { ex.thumb = await projectThumb(ex); await DB.put("projects", ex); if (S.view === "home") render(); }); }
  applyBrand(); render();
  try { if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost") && window.top === window) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch {}
})();
</script>
